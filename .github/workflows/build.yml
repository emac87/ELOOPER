name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Ad-hoc sign app
        # No Apple developer certificate: sign ad hoc so the bundle is valid on Apple Silicon.
        run: |
          codesign --force --deep --sign - --identifier com.elooper.app build/ELooper_artefacts/Release/ELooper.app
          codesign --verify --deep --strict --verbose=2 build/ELooper_artefacts/Release/ELooper.app
      - name: Package app
        run: ditto -c -k --keepParent build/ELooper_artefacts/Release/ELooper.app ELooper-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ELooper-macos
          path: ELooper-macos.zip
          if-no-files-found: error

  linux:
    name: Linux (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
