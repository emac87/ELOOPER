name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Ad-hoc sign app
        # No Apple developer certificate: sign ad hoc so the bundle is valid on Apple Silicon.
        run: |
          codesign --force --deep --sign - --identifier com.elooper.app build/ELooper_artefacts/Release/ELooper.app
          codesign --verify --deep --strict --verbose=2 build/ELooper_artefacts/Release/ELooper.app
      - name: Package app
        run: ditto -c -k --keepParent build/ELooper_artefacts/Release/ELooper.app ELooper-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ELooper-macos
          path: ELooper-macos.zip
          if-no-files-found: error

      - name: Package Chimera (AU, VST3, Standalone)
        run: |
          set -e
          A=build/Chimera_artefacts/Release
          mkdir -p Chimera
          cp -R "$A/AU/Chimera.component" "$A/VST3/Chimera.vst3" "$A/Standalone/Chimera.app" Chimera/
          for b in Chimera/Chimera.component Chimera/Chimera.vst3 Chimera/Chimera.app; do
            codesign --force --deep --sign - "$b"
          done
          cat > Chimera/README.txt <<'TXT'
          Chimera - multi-engine synth (analog, wavetable, DX7-style FM, sampler, pluck)

          Chimera.app        Standalone: drag to Applications. First launch: System Settings > Privacy & Security > Open Anyway.
          Chimera.component  Audio Unit (Logic, GarageBand, ELooper): copy to ~/Library/Audio/Plug-Ins/Components/
          Chimera.vst3       VST3 (Ableton, Bitwig, Reaper...): copy to ~/Library/Audio/Plug-Ins/VST3/

          These builds are not notarised. If a host refuses to load the plug-in, run in Terminal:
            xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/Chimera.component ~/Library/Audio/Plug-Ins/VST3/Chimera.vst3
          then restart the host (Logic may need its plug-in cache reset in Plug-in Manager).
          TXT
          sed -i '' 's/^          //' Chimera/README.txt
          ditto -c -k --keepParent Chimera Chimera-macos.zip

      - name: Upload Chimera
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-macos
          path: Chimera-macos.zip
          if-no-files-found: error

  windows:
    name: Windows (Chimera VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DELOOPER_BUILD_APP=OFF -DCHIMERA_BUILD_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release --target Chimera_VST3 Chimera_Standalone elooper_synth_tests

      - name: Test
        run: ctest --test-dir build -C Release -R synth --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $a = "build/Chimera_artefacts/Release"
          New-Item -ItemType Directory -Force Chimera | Out-Null
          Copy-Item -Recurse "$a/VST3/Chimera.vst3" Chimera/
          Copy-Item "$a/Standalone/Chimera.exe" Chimera/
          @"
          Chimera - multi-engine synth (analog, wavetable, DX7-style FM, sampler, pluck)

          Chimera.exe    Standalone: run it from anywhere. Windows SmartScreen may warn because the build is not signed:
                         click More info > Run anyway.
          Chimera.vst3   VST3 plug-in: copy the whole Chimera.vst3 folder to C:\Program Files\Common Files\VST3\
                         then rescan plug-ins in your DAW.
          "@ -replace '(?m)^          ', '' | Set-Content Chimera/README.txt
          Compress-Archive -Path Chimera -DestinationPath Chimera-windows.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-windows
          path: Chimera-windows.zip
          if-no-files-found: error

  web:
    name: Web (Chimera in the browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - name: Build
        run: web/build.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-web
          path: web/dist/chimera.html
          if-no-files-found: error

  release:
    # Publishes the newest Mac build at a permanent link:
    # https://github.com/emac87/ELOOPER/releases/download/latest/ELooper-macos.zip
    name: Publish "latest" release
    needs: [macos, windows, web]
    # ELooper's Mac build gates the release; Chimera's Windows/web files are added when they built.
    if: always() && needs.macos.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/elooper-initial'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ELooper-macos

      - uses: actions/download-artifact@v4
        with:
          name: Chimera-macos

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Chimera-windows

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Chimera-web

      - name: Move the latest tag and upload the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest build" \
              --notes "Newest successful Mac build of ELooper. Unzip, move ELooper.app to Applications, then System Settings > Privacy & Security > Open Anyway on first launch."
          fi
          gh release upload latest ELooper-macos.zip Chimera-macos.zip --clobber
          for f in Chimera-windows.zip chimera.html; do
            if [ -f "$f" ]; then gh release upload latest "$f" --clobber; fi
          done
          gh release edit latest --target "$GITHUB_SHA" --notes "Newest successful Mac build of ELooper (commit ${GITHUB_SHA::7}). Unzip, move ELooper.app to Applications, then System Settings > Privacy & Security > Open Anyway on first launch."

  linux:
    name: Linux (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
