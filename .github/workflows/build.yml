name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Release)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Ad-hoc sign app
        # No Apple developer certificate: sign ad hoc so the bundle is valid on Apple Silicon.
        run: |
          codesign --force --deep --sign - --identifier com.elooper.app build/ELooper_artefacts/Release/ELooper.app
          codesign --verify --deep --strict --verbose=2 build/ELooper_artefacts/Release/ELooper.app
      - name: Package app
        run: ditto -c -k --keepParent build/ELooper_artefacts/Release/ELooper.app ELooper-macos.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ELooper-macos
          path: ELooper-macos.zip
          if-no-files-found: error

  release:
    # Publishes the newest Mac build at a permanent link:
    # https://github.com/emac87/ELOOPER/releases/download/latest/ELooper-macos.zip
    name: Publish "latest" release
    needs: macos
    if: github.event_name == 'push' && github.ref == 'refs/heads/elooper-initial'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ELooper-macos

      - name: Move the latest tag and upload the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest build" \
              --notes "Newest successful Mac build of ELooper. Unzip, move ELooper.app to Applications, then System Settings > Privacy & Security > Open Anyway on first launch."
          fi
          gh release upload latest ELooper-macos.zip --clobber
          gh release edit latest --target "$GITHUB_SHA" --notes "Newest successful Mac build of ELooper (commit ${GITHUB_SHA::7}). Unzip, move ELooper.app to Applications, then System Settings > Privacy & Security > Open Anyway on first launch."

  linux:
    name: Linux (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
